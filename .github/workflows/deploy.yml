name: Deploy backend

on:
  workflow_run:
    workflows: ['Backend CI']
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      bootstrap_https:
        description: '최초 HTTPS 발급 (선택 시 문서에 연결된 Let’s Encrypt 약관에 동의)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev' && github.repository == 'Team-Hanmaum/hanmaum-backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # workflow_run uses the default branch here, never the triggering PR's code.
      - name: Checkout trusted release selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select successful dev CI commit or manual release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/select_release.py

  build:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/team-hanmaum/hanmaum-backend@${{ steps.image.outputs.digest }}
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify the exact release commit
        run: |
          ./gradlew check bootJar --no-daemon
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            python:3.13-slim-bookworm python /src/deploy/tests/activation_smoke.py
          python3 deploy/validate.py --nginx --postgres
          python3 deploy/tests/ai_tls_smoke.py
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Set up image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish immutable release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-hanmaum/hanmaum-backend:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/Team-Hanmaum/hanmaum-backend
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Only eligible releases enter this queue. A failed CI must not replace a pending deploy.
    concurrency:
      group: hanmaum-production-deployment
      queue: max
      cancel-in-progress: false
    # Configure this environment to allow ONLY the dev branch before adding secrets.
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      AWS_REGION: ap-southeast-2
      LIGHTSAIL_INSTANCE: hanmaum-server-01
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ubuntu
    steps:
      - name: Checkout the same release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Obtain short-lived AWS permissions
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: hanmaum-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Allow this runner's IPv4 only
        run: >-
          python3 deploy/firewall.py open
          --state "$RUNNER_TEMP/hanmaum-ssh-rule.json"
          --region "$AWS_REGION" --instance "$LIGHTSAIL_INSTANCE"
      - name: Prepare backup SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-sdk"
          "$RUNNER_TEMP/backup-sdk/bin/pip" install boto3==1.43.123
      - name: Transfer secrets and activate release
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_PYTHON: ${{ runner.temp }}/backup-sdk/bin/python
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          BOOTSTRAP_HTTPS: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_https || false }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          COMMAND_DIGEST_KEY: ${{ secrets.COMMAND_DIGEST_KEY }}
          INVITATION_ENCRYPTION_KEY: ${{ secrets.INVITATION_ENCRYPTION_KEY }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          ANALYSIS_WORKER_ENABLED: ${{ vars.ANALYSIS_WORKER_ENABLED }}
          ANALYSIS_WORKER_CONCURRENCY: ${{ vars.ANALYSIS_WORKER_CONCURRENCY }}
          ANALYSIS_WORKER_POLL_INTERVAL: ${{ vars.ANALYSIS_WORKER_POLL_INTERVAL }}
          ANALYSIS_WORKER_LEASE_DURATION: ${{ vars.ANALYSIS_WORKER_LEASE_DURATION }}
        run: bash deploy/send-release.sh
      - name: Verify public HTTPS and documentation
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://api.hanmaum.site/actuator/health | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            --output /dev/null https://api.hanmaum.site/swagger-ui/index.html
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://api.hanmaum.site/v3/api-docs | \
            python3 -c 'import json,sys; assert "/api/users/me" in json.load(sys.stdin)["paths"]'
      - name: Remove only this run's temporary SSH rule
        if: always()
        run: >-
          python3 deploy/firewall.py close
          --state "$RUNNER_TEMP/hanmaum-ssh-rule.json"
