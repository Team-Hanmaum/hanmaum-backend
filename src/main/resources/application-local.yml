spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:hanmaum}
    username: ${POSTGRES_USER:hanmaum}
    password: ${POSTGRES_PASSWORD:hanmaum-local-only}

server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  commands:
    digest-key: ${COMMAND_DIGEST_KEY:local-development-only-command-digest-key}
  security:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    login-success-url: ${FRONTEND_URL:http://localhost:5173}
    public-docs: true
