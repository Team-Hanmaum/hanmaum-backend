spring:
  application:
    name: hanmaum-backend
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: HANMAUM_SESSION
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    allowed-origins: []
    login-success-url: /
    public-docs: false
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    api-key: ${AI_INTERNAL_API_KEY:local-development-only}
    connect-timeout: 3s
    read-timeout: 30s
