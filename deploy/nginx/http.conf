user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    # Never log request paths, queries, cookies, headers or bodies.
    log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    # Nginx error messages can include the complete OAuth callback request URI.
    error_log /dev/null;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.hanmaum.site;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 503;
        }
    }
}
