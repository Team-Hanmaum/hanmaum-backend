user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Transport ceiling; the application's stricter per-endpoint limits still apply.
    client_max_body_size 2m;

    log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    # Avoid leaking OAuth codes and invitation tokens through raw Nginx error messages.
    error_log /dev/null;

    # Re-resolve the service after backend container replacement (Nginx >= 1.27.3).
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream hanmaum_backend {
        zone hanmaum_backend 64k;
        server backend:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.hanmaum.site;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 308 https://api.hanmaum.site$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.hanmaum.site;

        ssl_certificate /etc/letsencrypt/live/api.hanmaum.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hanmaum.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Includes /api, /oauth2/authorization/* and /login/oauth2/code/*.
        location / {
            proxy_pass http://hanmaum_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host api.hanmaum.site;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace client-supplied forwarding headers at this public trust boundary.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host api.hanmaum.site;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream off;
        }
    }
}
